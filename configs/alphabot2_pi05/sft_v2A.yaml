# v2A: current pi0.5 architecture
# + all accepted v2 trajectories (frozen manifest v2) + nav omega class balance (turns were already oversampled 2.3x in sanity_v1)
# + steering loss (omega x4 in the flow loss; smooth-L1 on the one-step denoised v/omega, first 10 chunk steps).
# Same budget for A and B: 1 GPU, effective batch 16 (micro 8 x accumulation 2: B carries 6 images), 10k steps; selection by plain masked VAL flow loss. No map / semantic controller / RL.
name: sft_v2A
init_checkpoint: /workspace/runtime/pi05/ckpt
train_data: /mnt/cfs/h0ddz1/personal/liyanjun/yanjun/lmm_runtime/datasets/alphabot2_ovmm_v2_train
val_data: /mnt/cfs/h0ddz1/personal/liyanjun/yanjun/lmm_runtime/datasets/alphabot2_ovmm_v2_val
out: /dev/shm/lmm_runtime/sft/v2A
cameras:
- camera_top
- camera_left
- camera_right
optim:
  lr: 2.5e-05
  decay_lr: 2.5e-06
  warmup: 1000
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.01
  grad_clip: 1.0
steps: 10000
batch_per_gpu: 8
grad_accum: 2
precision:
  params: float32
  autocast: bfloat16
gradient_checkpointing: true
val_every: 1000
ckpt_every: 1000
keep_ckpts: 1
num_workers: 10
seed: 1000
sampling:
  mode: phase_balanced
  stage_weight:
    default: 1.0
    reach: 3.0
    descend: 3.0
    grasp: 4.0
    lift: 3.0
    carry: 2.0
    reach_place: 3.0
    lower: 3.0
    release: 4.0
    retract: 2.0
    settle: 0.02
  cruise_weight: 0.2
  cruise_omega: 0.05
  cruise_v_frac: 0.8
  transition_weight: 3.0
  transition_window: 15
  arm_balance: true
  scene_power: 0.5
  nav_omega_balance: true
loss:
  dim_weights:
    base.omega: 4.0
  steer_aux:
    weight: 1.0
    steps: 10
    dims:
    - base.v
    - base.omega
