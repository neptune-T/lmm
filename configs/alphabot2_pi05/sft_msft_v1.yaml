# Manipulation-only continuation SFT from v2-B (minimal manipulation fix; docs/v2/pa_baseline.md).
# Same data, model contract, loss, history as v2-B; navigation / tuck / settle frames get sampling weight 0
# (they remain history / chunk context only). 3000 steps x 16 = 48k samples (30 % of v2-B's budget).
name: sft_msft_v1
init_checkpoint: /dev/shm/lmm_runtime/sft/v2B/best
train_data: /mnt/cfs/h0ddz1/personal/liyanjun/yanjun/lmm_runtime/datasets/alphabot2_ovmm_v2_train
val_data: /mnt/cfs/h0ddz1/personal/liyanjun/yanjun/lmm_runtime/datasets/alphabot2_ovmm_v2_val
out: /mnt/cfs/h0ddz1/personal/liyanjun/yanjun/lmm_runtime/sft/msft_v1
cameras:
- camera_top
- camera_left
- camera_right
optim:
  lr: 1.0e-05
  decay_lr: 2.5e-06
  warmup: 100
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.01
  grad_clip: 1.0
steps: 3000
batch_per_gpu: 8
grad_accum: 2
precision:
  params: float32
  autocast: bfloat16
gradient_checkpointing: true
val_every: 500
ckpt_every: 1000
keep_ckpts: 1
save_last: true
num_workers: 10
seed: 1001
sampling:
  mode: phase_balanced
  stage_weight:
    default: 0.0
    reach: 1.0
    descend: 1.0
    grasp: 1.5
    lift: 1.0
    carry: 1.0
    reach_place: 1.5
    lower: 1.5
    release: 2.0
    retract: 1.0
  cruise_weight: 1.0
  cruise_omega: 0.05
  cruise_v_frac: 0.8
  transition_weight: 2.0
  transition_window: 15
  arm_balance: true
  scene_power: 0.5
  nav_omega_balance: false
loss:
  dim_weights:
    base.omega: 1.0
  steer_aux:
    weight: 0.25
    steps: 10
    dims:
    - base.v
    - base.omega
history:
  camera: camera_top
  offsets:
  - 5
  - 10
  - 15
  state: false
resumable: true
